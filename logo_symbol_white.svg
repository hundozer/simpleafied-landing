<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' width='100' height='100'>
  <!-- Outer Circle Base -->
  <circle cx='50' cy='50' r='46' fill='#FEFEFE'/>
  
  <!-- Negative Space Circuit Cutouts matching Brandbook Page 1 & Page 7 -->
  <g stroke='#003242' stroke-linecap='round' stroke-linejoin='round' fill='none'>
    <!-- Top-left to bottom-left outer slice -->
    <path d='M 34 6 L 20 54' stroke-width='4'/>
    
    <!-- Main Left-to-Center Diagonal Trunk -->
    <path d='M 38 12 L 28 80' stroke-width='4.5'/>
    
    <!-- Upper Circuit Box Loop -->
    <path d='M 38 14 L 68 20 L 68 56 L 46 68' stroke-width='4.5'/>
    
    <!-- Upper Node Stem & Dot -->
    <path d='M 58 20 L 58 34' stroke-width='4.5'/>
    
    <!-- Center Node Stem & Dot -->
    <path d='M 32 64 L 46 50' stroke-width='4.5'/>
    
    <!-- Right Node Stem & Dot -->
    <path d='M 68 46 L 80 44' stroke-width='4.5'/>
    
    <!-- Bottom Segment Horizontal Slice -->
    <path d='M 24 76 Q 50 82 78 74' stroke-width='4'/>
    <path d='M 34 84 L 66 84' stroke-width='3.5'/>
  </g>

  <!-- Circuit Data Nodes (Dots) -->
  <g fill='#003242'>
    <!-- Upper Loop Node -->
    <circle cx='58' cy='34' r='5'/>
    <!-- Center Node -->
    <circle cx='46' cy='50' r='5'/>
    <!-- Right Node -->
    <circle cx='80' cy='44' r='5'/>
  </g>
</svg>